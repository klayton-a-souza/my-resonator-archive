<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build | Resonator Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="build-page">
      <div class="cinematic-bg" aria-hidden="true"></div>
      <div class="ambient-grid" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Voltar para Resonator Archive">
          <span class="brand-mark"></span>
          <span>Resonator Archive</span>
        </a>
        <nav class="nav-links" aria-label="Navegacao">
          <a href="index.html">Personagens</a>
        </nav>
      </header>

      <section class="build-shell" id="buildRoot" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
    <script>
      function getCharacterNameFromUrl() {
        const params = new URLSearchParams(window.location.search);

        return params.get("char");
      }

      function findCharacterByName(name) {
        return characters.find((character) => character.name === name);
      }

      function getTalentFocus(character) {
        return character.talents && character.talents.length > 0
          ? character.talents
          : ["Talentos nao informados"];
      }

      function getSecondaryStats(character) {
        return character.secondaryStats && character.secondaryStats.length > 0
          ? character.secondaryStats
          : ["Status secundarios nao informados"];
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function getProgressStorageKey(character) {
        return `ww-build-checklist:${character.name}`;
      }

      function getDefaultBuildProgress() {
        return {
          characterLevel: false,
          weaponLevel: false,
          talents: false,
          echoes: false,
        };
      }

      function loadBuildProgress(character) {
        const defaults = getDefaultBuildProgress();
        let savedProgress = null;

        try {
          savedProgress = localStorage.getItem(getProgressStorageKey(character));
        } catch {
          return defaults;
        }

        if (!savedProgress) {
          return defaults;
        }

        try {
          const parsedProgress = JSON.parse(savedProgress);

          return {
            ...defaults,
            ...parsedProgress,
          };
        } catch {
          return defaults;
        }
      }

      function saveBuildProgress(character, progress) {
        try {
          localStorage.setItem(
            getProgressStorageKey(character),
            JSON.stringify(progress)
          );
        } catch {
          return;
        }
      }

      function getWeightedProgress(progress) {
        const completedItems = Object.values(progress).filter(Boolean).length;

        return Math.round((completedItems / 4) * 100);
      }

      function getProgressFromForm(root, character) {
        const progress = loadBuildProgress(character);

        return {
          ...progress,
          characterLevel: root.querySelector("#characterLevelInput").checked,
          weaponLevel: root.querySelector("#weaponLevelInput").checked,
          talents: root.querySelector("#talentsInput").checked,
          echoes: root.querySelector("#echoesInput").checked,
        };
      }

      function updateBuildProgress(root, character) {
        const progress = getProgressFromForm(root, character);
        const totalProgress = getWeightedProgress(progress);

        root.querySelector("#totalProgressValue").textContent = `${totalProgress}%`;
        root.querySelector("#totalProgressBar").style.width = `${totalProgress}%`;
        root.querySelectorAll("[data-check-item]").forEach((item) => {
          const checkbox = item.querySelector("input");

          item.classList.toggle("is-complete", checkbox.checked);
        });

        saveBuildProgress(character, progress);
      }

      function renderBuildError(root, message) {
        root.innerHTML = `
          <article class="build-card build-error">
            <p class="eyebrow">Build nao encontrada</p>
            <h1>Ops</h1>
            <p>${escapeHtml(message)}</p>
            <a class="build-back-link" href="index.html">Voltar para personagens</a>
          </article>
        `;
      }

      function renderCharacterBuild(character) {
        const root = document.querySelector("#buildRoot");
        const progress = loadBuildProgress(character);
        const secondaryStats = getSecondaryStats(character);
        const talents = getTalentFocus(character);

        root.innerHTML = `
          <article class="build-card build-progress-card">
            <div class="build-portrait">
              <img src="${escapeHtml(character.image)}" alt="${escapeHtml(character.name)}" />
            </div>
            <div class="build-content">
              <div class="build-title-row">
                <div>
                  <p class="eyebrow">${escapeHtml(character.role)}</p>
                  <h1>${escapeHtml(character.name)}</h1>
                </div>
                <div class="build-total-badge">
                  <span>Progresso</span>
                  <strong id="totalProgressValue">0%</strong>
                </div>
              </div>

              <section class="build-progress-hero" aria-label="Progresso geral da build">
                <div>
                  <span>Checklist da build</span>
                  <strong>Marque o que ja esta pronto</strong>
                </div>
                <div class="progress-track progress-track-large">
                  <span id="totalProgressBar"></span>
                </div>
              </section>

              <div class="build-checklist">
                <label class="build-check-item" data-check-item>
                  <input id="characterLevelInput" type="checkbox" ${progress.characterLevel ? "checked" : ""} />
                  <span>Nivel de personagem</span>
                </label>
                <label class="build-check-item" data-check-item>
                  <input id="weaponLevelInput" type="checkbox" ${progress.weaponLevel ? "checked" : ""} />
                  <span>Nivel de arma</span>
                </label>
                <label class="build-check-item" data-check-item>
                  <input id="talentsInput" type="checkbox" ${progress.talents ? "checked" : ""} />
                  <span>Talentos</span>
                </label>
                <label class="build-check-item" data-check-item>
                  <input id="echoesInput" type="checkbox" ${progress.echoes ? "checked" : ""} />
                  <span>Ecos</span>
                </label>
              </div>

              <section class="secondary-stats">
                <span>Status secundarios</span>
                <div>
                  ${secondaryStats.map((stat) => `<strong>${escapeHtml(stat)}</strong>`).join("")}
                </div>
              </section>

              <section class="talent-focus">
                <span>Talentos para focar</span>
                <ol>
                  ${talents.map((talent) => `<li>${escapeHtml(talent)}</li>`).join("")}
                </ol>
              </section>

              <a class="build-back-link" href="index.html">Voltar para personagens</a>
            </div>
          </article>
        `;

        root.addEventListener("input", (event) => {
          if (event.target.matches("input")) {
            updateBuildProgress(root, character);
          }
        });

        root.addEventListener("change", (event) => {
          if (event.target.matches("input")) {
            updateBuildProgress(root, character);
          }
        });

        updateBuildProgress(root, character);
      }

      function initBuildPage() {
        const root = document.querySelector("#buildRoot");
        const characterName = getCharacterNameFromUrl();

        if (!characterName) {
          renderBuildError(root, "Nenhum personagem foi informado na URL.");
          return;
        }

        const character = findCharacterByName(characterName);

        if (!character) {
          renderBuildError(root, `Personagem "${characterName}" nao encontrado.`);
          return;
        }

        renderCharacterBuild(character);
      }

      initBuildPage();
    </script>
  </body>
</html>
